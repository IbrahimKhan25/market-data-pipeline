# Pipeline configuration. Any value can be overridden with an MP_-prefixed
# environment variable, using "__" for nesting (e.g. MP_ML__HORIZON_DAYS=10).

source: yahoo            # yahoo | synthetic
start_date: "2015-01-01" # history backfill start for tickers with no data yet
lookback_days: 5         # re-fetch window on incremental runs to capture late revisions

tickers:
  # Mega-cap tech
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - META
  - TSLA
  # Financials / healthcare / energy / staples
  - JPM
  - GS
  - JNJ
  - UNH
  - XOM
  - CVX
  - PG
  - KO
  - WMT
  # Broad-market and sector ETFs
  - SPY
  - QQQ
  - IWM
  - XLE

paths:
  data_dir: data
  warehouse: data/warehouse.duckdb
  models_dir: models
  reports_dir: reports

ml:
  horizon_days: 5
  n_splits: 5
  test_days: 252
  min_train_days: 504
  min_improvement_vs_naive: 0.05  # champion must cut QLIKE vs the naive baseline by >= 5% to be promoted
  mlflow_tracking_uri: sqlite:///mlflow.db
  mlflow_experiment: volatility-forecasting
  lgbm_params:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0

azure:
  container: market-data
  prefix: market-pipeline
