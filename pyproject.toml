[project]
name = "market-pipeline"
version = "1.0.0"
description = "Market data lakehouse + volatility forecasting: ingestion, data contracts, dbt/DuckDB modelling, ML training and serving."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ibrahim Khan" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.1",
    "yfinance>=0.2.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "pandera>=0.20",
    "tenacity>=8.3",
    "typer>=0.12",
    "azure-storage-blob>=12.20",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "mlflow>=2.14",
    "joblib>=1.4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
orchestration = ["prefect>=3.0"]

[project.scripts]
market-pipeline = "market_pipeline.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pre-commit>=3.7", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "pandas-stubs", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs network or external services"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]
